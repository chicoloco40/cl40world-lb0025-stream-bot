name: Deploy Next.js + B2C Streaming Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          # Site
          NEXT_PUBLIC_SITE_URL: https://cl40.contact

          # Spotify
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

          # Discord Bot
          NEXT_PUBLIC_DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          NEXT_PUBLIC_DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          NEXT_PUBLIC_DISCORD_INVITE: https://discord.gg/SzqSrCHJH
          NEXT_PUBLIC_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

          # Webhook B2C
          NEXT_PUBLIC_B2C_WEBHOOK: ${{ secrets.B2C_WEBHOOK }}

          # Google Developer (ready)
          NEXT_PUBLIC_GOOGLE_DEV: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
